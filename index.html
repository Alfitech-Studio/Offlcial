  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       GLOBAL STYLES & CYBER-FUTURISTIC CANVAS
       ========================================================================== */
    body {
      background-color: #030509;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Cyber Grid Background Pattern */
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 40s linear infinite;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 80px; }
    }

    /* ==========================================================================
       GLASSMORPHISM & GLOW EFFECTS
       ========================================================================== */
    .glass-header {
      background: rgba(3, 5, 9, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(8, 13, 26, 0.8) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.7s ease;
      pointer-events: none;
    }

    .glass-card:hover::before {
      left: 140%;
    }

    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 12px 40px -10px rgba(16, 185, 129, 0.25), 0 0 20px rgba(6, 182, 212, 0.15);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ==========================================================================
       3D ANIMATIONS & MOTION GRAPHICS
       ========================================================================== */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    /* Continuous Rotations */
    .rotate-3d-slow {
      animation: rotate3d 28s infinite linear;
    }

    .rotate-3d-reverse {
      animation: rotate3dRev 22s infinite linear;
    }

    @keyframes rotate3d {
      0% { transform: rotateX(15deg) rotateY(0deg) rotateZ(0deg); }
      50% { transform: rotateX(30deg) rotateY(180deg) rotateZ(15deg); }
      100% { transform: rotateX(15deg) rotateY(360deg) rotateZ(0deg); }
    }

    @keyframes rotate3dRev {
      0% { transform: rotateX(-20deg) rotateY(360deg) rotateZ(0deg); }
      50% { transform: rotateX(10deg) rotateY(180deg) rotateZ(-15deg); }
      100% { transform: rotateX(-20deg) rotateY(0deg) rotateZ(0deg); }
    }

    /* Floating Animations */
    .float-slow {
      animation: float 5s ease-in-out infinite;
    }

    .float-reverse {
      animation: floatReverse 6s ease-in-out infinite;
    }

    .float-fast {
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(6deg); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(20px) rotate(-6deg); }
    }

    /* Pulse & Glow Movement */
    .pulse-glow {
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.25; filter: blur(50px); transform: scale(0.85); }
      100% { opacity: 0.65; filter: blur(75px); transform: scale(1.15); }
    }

    /* Scanning Light Beam */
    .scan-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, #06b6d4, transparent);
      animation: scanBeam 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      opacity: 0.7;
    }

    @keyframes scanBeam {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Pulse Core for Logo */
    .logo-pulse-core {
      animation: logoPulse 2.5s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
    }

    .logo-ring-rotate {
      animation: ringRotate 12s linear infinite;
      transform-origin: center;
    }

    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Reveal Animations on Scroll */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px; height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #030509;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    /* Fade Page Transitions */
    .fade-enter {
      opacity: 0;
      transform: translateY(15px) scale(0.99);
    }
    .fade-enter-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

  <script>
    /* -------------------------------------------------------------------------- */
    /* 1. STATE MANAGEMENT & TRANSLATIONS                                        */
    /* -------------------------------------------------------------------------- */
    let currentData = null;
    let currentLang = localStorage.getItem('alfitech_lang') || 'en';
    let featuredTimer = null;
    let currentLightboxIndex = 0;
    let currentLightboxScreenshots = [];

    const translations = {
      id: {
        home: "Beranda",
        about: "Tentang",
        featured: "Pilihan Utama",
        applications: "Aplikasi & Game Kami",
        explore: "Jelajahi Aplikasi",
        download: "UNDUH APK",
        version: "Versi",
        size: "Ukuran",
        android: "Persyaratan Android",
        features: "Fitur Unggulan",
        supportTitle: "Dukungan Anda Sangat Berarti",
        supportText: "Setiap aplikasi yang kami buat merupakan hasil dari waktu, ide, proses, dan usaha untuk menghadirkan sesuatu yang bermanfaat dan menyenangkan. Dukungan Anda membantu ALFITECH Studio terus mengembangkan aplikasi baru, memperbaiki karya yang sudah ada, dan memberikan pengalaman yang lebih baik di masa mendatang.",
        supportSubtext: "Jika Anda menikmati karya kami dan ingin mendukung perjalanan ALFITECH Studio, dukungan sekecil apa pun sangat berarti bagi kami.",
        supportAccount: "Dukungan via:",
        noApps: "Belum ada aplikasi yang tersedia.",
        back: "Kembali",
        screenshots: "Tangkapan Layar",
        heroSubtitle: "Pengalaman Digital Masa Depan",
        heroDesc: "Jelajahi berbagai aplikasi & game futuristik yang dirancang dengan dedikasi tinggi dan fungsionalitas presisi oleh ALFITECH Studio.",
        errorTitle: "Gagal Memuat Data ALFITECH",
        errorDesc: "Pastikan berkas data/data.json tersedia dan formatnya valid.",
        retry: "Coba Lagi",
        additionalInfo: "Informasi Tambahan",
        developer: "Pengembang",
        genre: "Genre",
        status: "Status",
        lastUpdate: "Pembaruan Terakhir"
      },
      en: {
        home: "Home",
        about: "About",
        featured: "Featured Highlights",
        applications: "Our Applications & Games",
        explore: "Explore Application",
        download: "DOWNLOAD APK",
        version: "Version",
        size: "Size",
        android: "Android Requirement",
        features: "Key Features",
        supportTitle: "Your Support Matters",
        supportText: "Every app we build is a result of time, ideas, craftsmanship, and effort to deliver something useful and enjoyable. Your support helps ALFITECH Studio continue developing new apps, improving existing ones, and providing better experiences in the future.",
        supportSubtext: "If you enjoy our work and wish to support ALFITECH Studio's journey, even the smallest contribution means the world to us.",
        supportAccount: "Donate via:",
        noApps: "No applications available yet.",
        back: "Back",
        screenshots: "Screenshots Showcase",
        heroSubtitle: "Creating digital experiences with purpose.",
        heroDesc: "Explore top-tier applications & games crafted with passion, futuristic UI, and high performance by ALFITECH Studio.",
        errorTitle: "Unable to load ALFITECH data.",
        errorDesc: "Please verify that data/data.json exists and contains valid JSON content.",
        retry: "Try Again",
        additionalInfo: "Additional Information",
        developer: "Developer",
        genre: "Genre",
        status: "Status",
        lastUpdate: "Last Update"
      }
    };

    /* -------------------------------------------------------------------------- */
    /* 2. INITIALIZATION & DATA FETCHING                                         */
    /* -------------------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      setupHeaderScroll();
      
      // Handle Browser Navigation (Popstate)
      window.addEventListener('popstate', () => {
        renderCurrentRoute();
      });
    });

    async function initApp() {
      try {
        const response = await fetch("data/data.json");
        if (!response.ok) throw new Error("Network response failed");
        currentData = await response.json();
        
        updateBranding();
        updateLanguageUI();
        renderCurrentRoute();
      } catch (error) {
        console.error("Error loading ALFITECH data:", error);
        renderErrorState();
      }
    }

    function updateBranding() {
      if (!currentData) return;
      const studioName = currentData.studio?.nama || "ALFITECH Studio";
      document.getElementById('header-studio-name').innerText = studioName;
      document.getElementById('footer-studio-name').innerText = studioName;
      document.getElementById('footer-copy-name').innerText = studioName;

      if (currentData.studio?.deskripsi) {
        document.getElementById('footer-tagline').innerText = currentData.studio.deskripsi;
      }

      if (currentData.website?.tahun) {
        document.getElementById('footer-year').innerText = currentData.website.tahun;
      } else {
        document.getElementById('footer-year').innerText = new Date().getFullYear();
      }
    }

    /* -------------------------------------------------------------------------- */
    /* 3. ROUTING & STATE CONTROLLER                                            */
    /* -------------------------------------------------------------------------- */
    function renderCurrentRoute() {
      if (!currentData) return;
      
      const params = new URLSearchParams(window.location.search);
      const appId = params.get('app');
      const hash = window.location.hash;

      if (appId) {
        renderAppDetailView(appId);
      } else if (hash === '#about') {
        renderAboutView();
      } else {
        renderHomeView();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      setupScrollObserver();
    }

    function navigateToHome(e) {
      if (e) e.preventDefault();
      if (featuredTimer) clearInterval(featuredTimer);
      history.pushState(null, '', window.location.pathname);
      renderHomeView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setupScrollObserver();
    }

    function navigateToAbout(e) {
      if (e) e.preventDefault();
      if (featuredTimer) clearInterval(featuredTimer);
      history.pushState(null, '', window.location.pathname + '#about');
      renderAboutView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setupScrollObserver();
    }

    function navigateToDetail(appId) {
      if (featuredTimer) clearInterval(featuredTimer);
      history.pushState(null, '', `?app=${appId}`);
      renderAppDetailView(appId);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setupScrollObserver();
    }

    /* -------------------------------------------------------------------------- */
    /* 4. LANGUAGE SYSTEM                                                        */
    /* -------------------------------------------------------------------------- */
    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'id' : 'en';
      localStorage.setItem('alfitech_lang', currentLang);
      updateLanguageUI();
      renderCurrentRoute();
    }

    function updateLanguageUI() {
      const t = translations[currentLang];
      
      document.getElementById('nav-home').innerText = t.home;
      document.getElementById('nav-about').innerText = t.about;
      document.getElementById('footer-nav-home').innerText = t.home;
      document.getElementById('footer-nav-about').innerText = t.about;

      const indicatorEn = document.getElementById('lang-indicator-en');
      const indicatorId = document.getElementById('lang-indicator-id');

      if (currentLang === 'en') {
        indicatorEn.className = "text-brand-400 font-bold";
        indicatorId.className = "text-slate-500 font-normal";
      } else {
        indicatorEn.className = "text-slate-500 font-normal";
        indicatorId.className = "text-brand-400 font-bold";
      }
    }

    function getAppText(app, field) {
      if (currentLang === 'en' && app[`${field}_en`]) {
        return app[`${field}_en`];
      }
      return app[field] || '';

    let activeSlide = 0;
    function initCarousel(totalSlides) {
      if (featuredTimer) clearInterval(featuredTimer);
      featuredTimer = setInterval(() => {
        activeSlide = (activeSlide + 1) % totalSlides;
        setCarouselSlide(activeSlide);
      }, 6000);
    }

    function setCarouselSlide(index) {
      activeSlide = index;
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.carousel-dot');

      slides.forEach((slide, i) => {
        if (i === index) {
          slide.classList.remove('opacity-0', 'z-0');
          slide.classList.add('opacity-100', 'z-10');
        } else {
          slide.classList.remove('opacity-100', 'z-10');
          slide.classList.add('opacity-0', 'z-0');
        }
      });

      dots.forEach((dot, i) => {
        if (i === index) {
          dot.className = "carousel-dot w-8 h-3 rounded-full bg-brand-400 transition-all shadow-lg shadow-brand-400/50";
        } else {
          dot.className = "carousel-dot w-3 h-3 rounded-full bg-white/30 hover:bg-white transition-all";
        }
      });
    }

      if (currentLightboxScreenshots.length === 0) return;
      currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxScreenshots.length) % currentLightboxScreenshots.length;

      if (currentLightboxScreenshots.length === 0) return;

    function setupHeaderScroll() {
      const header = document.getElementById('main-header');

        if (window.scrollY > 30) {
          header.classList.add('py-2.5', 'shadow-2xl');
          header.classList.remove('py-4');
        } else {
          header.classList.add('py-4');
          header.classList.remove('py-2.5', 'shadow-2xl');
        }
      });
    }

    function setupScrollObserver() {
      setTimeout(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
      }, 100);
